name: mvp
description: "Единственная рабочая конфигурация (i3-1115G4, iGPU, 7.7 ГБ ОЗУ), реальное время на записях 1080p: YOLO26n@960 (OpenVINO iGPU) + RTMPose-s только у людей с рукой у лица, 5 к/с, предмет — Beehzod YOLO11m на OpenVINO iGPU, фото-признак — zero-shot CLIP, классификатор cycle_mvp. Режим качества (10 к/с, ≈ в 2 раза медленнее реального времени): -s video.process_fps=10 -s options.cycle_bundle=models/cycle/cycle_mvp10. Отчёт — docs/FINAL.md."
config:
  video.process_fps: 5
  pose.refine.gate_s: 3.0
  pose.refine.gate_hold_sec: 1.0
  evidence.runtime: openvino
  evidence.device: "intel:gpu"
  events.cycle_th: 0.4
  events.confidence_threshold: 0.55
options:
  cycle_bundle: models/cycle/cycle_mvp
  photo_bundle: models/photo/photo_v2
  objects: [smoking_yolo11m_beehzod]
  vlm_mode: "off"
