name: laptop_cpu
description: "Лучший профиль для ЭТОГО ноутбука (i3-1115G4, iGPU, 7.7 ГБ ОЗУ, без NVIDIA): поза YOLO26n@1280 на OpenVINO iGPU + RTMPose-s (по лестнице вычислений вход 1280 находит затяжки на далёких людях 14 из 16 против 7 у 960; модель крупнее выигрыша не даёт), BoT-SORT, классификатор цикла cycle_mvp (предмет двух детекторов + пауза + zero-shot CLIP), VLM выключен (+0.03 внутри шума, 11 с на цикл). Пороги зафиксированы по oof-плато."
config:
  pose.imgsz: 1280
  events.cycle_th: 0.4
  events.confidence_threshold: 0.55
options:
  cycle_bundle: models/cycle/cycle_mvp
  photo_bundle: models/photo/photo_v2
  objects: [smoking_yolo11m_beehzod, smoking_yolo26s_basant18]
  vlm_mode: "off"
