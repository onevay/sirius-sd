# Запуск проекта в изолированной среде.
#   docker compose up --build ui                       # веб-интерфейс на http://127.0.0.1:8501 (порт опубликован ТОЛЬКО на этой машине)
#   docker compose run --rm cli doctor                 # проверка окружения
#   docker compose run --rm cli recognize /app/data/курение/sm_6.mp4 --start 0 --end 30 --cycle-bundle models/cycle/cycle_v1 --photo-bundle models/photo/photo_v2
#   docker compose --profile vlm up -d ollama          # локальный Ollama для VLM (внутри сети compose, наружу не публикуется)
# Данные и веса не лежат в образе: монтируются ниже. Первый запуск на новой машине: `docker compose run --rm cli models get yolo26n-pose` и т. д. (нужна сеть)
# или скопируйте готовую папку models/ (в т.ч. из zip-экспорта вкладки «Модели»).
name: smoking-detection

x-sd-common: &sd-common
  image: onevay/smoking-detection:gpu
  build:
    context: .
    args:
      TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
  environment:
    SD_OLLAMA_URL: http://ollama:11434
    SD_THREADS: ${SD_THREADS:-2}
    HF_HUB_DISABLE_TELEMETRY: "1"
  volumes:
    - ./data:/app/data:ro # ваши записи — только чтение
    - ./data_external:/app/data_external # открытые датасеты
    - ./models:/app/models # веса и пакеты моделей
    - ./outputs:/app/outputs # результаты, кэши позы, прогоны распознавания
    - ./labels:/app/labels # ручные метки циклов
    - ./docs/review:/app/docs/review # метки ассистента/жестов (CSV)
    - ./configs/experiments:/app/configs/experiments # профили моделей (создаются и правятся в вебе)
    - ./configs/classifiers:/app/configs/classifiers # спецификации классификатора (страница «Классификатор»)
  # ограничьте память под слабый ПК, чтобы контейнер не вытеснил систему в своп: mem_limit: 5g

services:
  ui:
    <<: *sd-common
    command: [ "ui", "--host", "0.0.0.0", "--port", "8501" ]
    ports:
      - "127.0.0.1:8501:8501" # не 0.0.0.0: интерфейс не должен быть виден из сети

  cli:
    <<: *sd-common
    profiles: [ "tools" ]
    # запуск: docker compose run --rm cli <команда sd>
    command: [ "--help" ]

  ollama:
    profiles: [ "vlm" ]
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest} # зафиксируйте версию тегом (на ноутбуке проверялась 0.40.0)
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1" # облачные модели и функции выключены: кадры никуда не уходят
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - "11434" # только внутри сети compose
    # GPU NVIDIA (по желанию): deploy.resources.reservations.devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  ollama_models:
