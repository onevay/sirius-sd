<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 620" width="1250" height="620" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1250" height="620" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Жизненный цикл события у оператора</text><rect x="30.0" y="250.0" width="190.0" height="70.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="125.0" y="279.1" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">Новое</text><text x="125.0" y="300.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">создано движком, open</text><rect x="280.0" y="250.0" width="190.0" height="70.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="375.0" y="279.1" font-size="14" fill="#5b21b6" font-weight="700" text-anchor="middle">На рассмотрении</text><text x="375.0" y="300.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">взято оператором</text><rect x="560.0" y="100.0" width="190.0" height="70.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="655.0" y="129.1" font-size="14" fill="#166534" font-weight="700" text-anchor="middle">Подтверждено</text><text x="655.0" y="150.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">курение было</text><rect x="560.0" y="250.0" width="190.0" height="70.0" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.4"/><text x="655.0" y="279.1" font-size="14" fill="#991b1b" font-weight="700" text-anchor="middle">Ложное</text><text x="655.0" y="300.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">+ код причины</text><rect x="560.0" y="400.0" width="190.0" height="70.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="655.0" y="429.1" font-size="14" fill="#92400e" font-weight="700" text-anchor="middle">Не уверен</text><text x="655.0" y="450.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">нужен второй взгляд</text><rect x="830.0" y="400.0" width="190.0" height="70.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="925.0" y="429.1" font-size="14" fill="#92400e" font-weight="700" text-anchor="middle">Эскалировано</text><text x="925.0" y="450.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">старшему смены</text><rect x="1030.0" y="250.0" width="190.0" height="70.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="1125.0" y="279.1" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Закрыто</text><text x="1125.0" y="300.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">в отчётах и датасете</text><line x1="220.0" y1="285.0" x2="280.0" y2="285.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="250.0" y="279.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">взял</text><line x1="470.0" y1="285.0" x2="560.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="515.0" y="204.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">Y</text><line x1="470.0" y1="285.0" x2="560.0" y2="285.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="515.0" y="279.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">N</text><line x1="470.0" y1="285.0" x2="560.0" y2="435.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="515.0" y="354.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">U</text><line x1="750.0" y1="435.0" x2="830.0" y2="435.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="790.0" y="429.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">E</text><line x1="750.0" y1="135.0" x2="1030.0" y2="285.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="750.0" y1="285.0" x2="1030.0" y2="285.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="925.0" y1="400.0" x2="1125.0" y2="322.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="1055.0" y="361.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">решение старшего</text><path d="M125,250 C125,180 330,180 365,248" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="220.0" y="178.0" font-size="11" fill="#1d4ed8" font-weight="400" text-anchor="middle">движок: update (+цикл), close</text><rect x="30.0" y="470.0" width="470.0" height="125.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="42.0" y="511.0" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">Правила</text><text x="42.0" y="531.3" font-size="11.2" fill="#6b7280" font-weight="400" text-anchor="start">Решение оператора не сбрасывается обновлением от движка. История решений</text><text x="42.0" y="546.4" font-size="11.2" fill="#6b7280" font-weight="400" text-anchor="start">неизменяема (Review — только добавление). SLA реакции: таймер на карточке,</text><text x="42.0" y="561.5" font-size="11.2" fill="#6b7280" font-weight="400" text-anchor="start">жёлтый после 60 с, красный после 120 с (значения — настройка города).</text><rect x="530.0" y="500.0" width="690.0" height="95.0" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.4"/><text x="542.0" y="533.6" font-size="13" fill="#991b1b" font-weight="700" text-anchor="start">Справочник причин «ложное»</text><text x="542.0" y="553.9" font-size="11.2" fill="#6b7280" font-weight="400" text-anchor="start">питьё · телефон · касание лица · еда · ручка/предмет · жест без предмета · ошибка трека (два человека) · не</text><text x="542.0" y="569.0" font-size="11.2" fill="#6b7280" font-weight="400" text-anchor="start">человек/артефакт · другое (с заметкой)</text><text x="560.0" y="85.0" font-size="11" fill="#166534" font-weight="600" text-anchor="start">→ кандидат в позитивы обучения</text></svg>