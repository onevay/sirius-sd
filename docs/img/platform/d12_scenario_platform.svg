<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 720" width="1420" height="720" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1420" height="720" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Платформа сценариев: что общее, что специфично</text><rect x="30.0" y="560.0" width="1360.0" height="120.0" rx="12" fill="#e8effd" stroke="#2563eb" stroke-width="1.2"/><text x="50.0" y="588.0" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="start">Восприятие (общее для всех сценариев)</text><rect x="50.0" y="602.0" width="206.0" height="58.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="153.0" y="635.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Декодирование и ingest</text><rect x="272.0" y="602.0" width="206.0" height="58.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="375.0" y="635.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Детектор людей и объектов</text><rect x="494.0" y="602.0" width="206.0" height="58.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="597.0" y="627.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Трекер (BoT-SORT) +</text><text x="597.0" y="642.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">склейка</text><rect x="716.0" y="602.0" width="206.0" height="58.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="819.0" y="635.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Поза (17 точек)</text><rect x="938.0" y="602.0" width="206.0" height="58.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1041.0" y="635.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">ReID (опционально)</text><rect x="1160.0" y="602.0" width="206.0" height="58.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1263.0" y="635.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Зоны / ROI камеры</text><rect x="30.0" y="400.0" width="1360.0" height="130.0" rx="12" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.2"/><text x="50.0" y="428.0" font-size="14" fill="#5b21b6" font-weight="700" text-anchor="start">Сигналы (переиспользуемые признаки)</text><rect x="50.0" y="445.0" width="176.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="138.0" y="479.9" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">кинематика рук</text><rect x="240.0" y="445.0" width="176.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="328.0" y="479.9" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">предмет в руке/у лица</text><rect x="430.0" y="445.0" width="176.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="518.0" y="479.9" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">поза тела (лёжа/сидя)</text><rect x="620.0" y="445.0" width="176.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="708.0" y="479.9" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">время в зоне</text><rect x="810.0" y="445.0" width="176.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="898.0" y="479.9" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">плотность людей</text><rect x="1000.0" y="445.0" width="176.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1088.0" y="479.9" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">скорость, рывки</text><rect x="1190.0" y="445.0" width="176.0" height="62.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1278.0" y="479.9" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">предмет без владельца</text><rect x="30.0" y="150.0" width="1000.0" height="220.0" rx="12" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.2"/><text x="50.0" y="178.0" font-size="14" fill="#0f766e" font-weight="700" text-anchor="start">Сценарии-плагины: сигналы + правило + классификатор + регламент</text><rect x="50.0" y="195.0" width="228.0" height="72.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="164.0" y="225.0" font-size="13.5" fill="#166534" font-weight="700" text-anchor="middle">Курение</text><text x="164.0" y="245.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">есть: циклы рука–рот</text><rect x="293.0" y="195.0" width="228.0" height="72.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="407.0" y="225.0" font-size="13.5" fill="#166534" font-weight="700" text-anchor="middle">Распитие</text><text x="407.0" y="245.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">близко: те же циклы</text><rect x="536.0" y="195.0" width="228.0" height="72.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="650.0" y="225.0" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="middle">Падение</text><text x="650.0" y="245.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">поза + время лёжа</text><rect x="779.0" y="195.0" width="228.0" height="72.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="893.0" y="225.0" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="middle">Нет СИЗ</text><text x="893.0" y="245.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">детектор каски/жилета</text><rect x="50.0" y="280.0" width="228.0" height="72.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="164.0" y="310.0" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="middle">Скопление</text><text x="164.0" y="330.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">плотность + время</text><rect x="293.0" y="280.0" width="228.0" height="72.0" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.4"/><text x="407.0" y="310.0" font-size="13.5" fill="#991b1b" font-weight="700" text-anchor="middle">Оставленный предмет</text><text x="407.0" y="330.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">предмет без владельца</text><rect x="536.0" y="280.0" width="228.0" height="72.0" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.4"/><text x="650.0" y="310.0" font-size="13.5" fill="#991b1b" font-weight="700" text-anchor="middle">Драка</text><text x="650.0" y="330.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">кинематика пар, рывки</text><rect x="779.0" y="280.0" width="228.0" height="72.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="893.0" y="310.0" font-size="13.5" fill="#166534" font-weight="700" text-anchor="middle">Вход в зону</text><text x="893.0" y="330.8" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">ROI + время</text><rect x="1060.0" y="150.0" width="330.0" height="220.0" rx="12" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/><text x="1080.0" y="178.0" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">Общее для продукта</text><text x="1085.0" y="210.0" font-size="12.5" fill="#1f2937" font-weight="400" text-anchor="start">• хранилище событий и решений</text><text x="1085.0" y="240.0" font-size="12.5" fill="#1f2937" font-weight="400" text-anchor="start">• очередь и карточка оператора</text><text x="1085.0" y="270.0" font-size="12.5" fill="#1f2937" font-weight="400" text-anchor="start">• разметка и Event F1</text><text x="1085.0" y="300.0" font-size="12.5" fill="#1f2937" font-weight="400" text-anchor="start">• реестр, выпуск, отчёты</text><text x="1085.0" y="330.0" font-size="12.5" fill="#1f2937" font-weight="400" text-anchor="start">• роли, аудит, retention</text><rect x="30.0" y="55.0" width="1360.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="42.0" y="77.8" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">Контракт сценария</text><text x="42.0" y="99.3" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">class Scenario: id, signals() → требуемые сигналы; detect(window) → кандидаты; classifier (пакет); regulation (правила события и сопоставления); card() → поля карточки оператора. Цвет: зелёный — готово или почти,</text><text x="42.0" y="115.5" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">жёлтый — нужен детектор/данные, красный — нужна новая модель.</text><line x1="215.0" y1="558.0" x2="215.0" y2="532.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="700.0" y1="558.0" x2="700.0" y2="532.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="1180.0" y1="558.0" x2="1180.0" y2="532.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="300.0" y1="398.0" x2="300.0" y2="372.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="800.0" y1="398.0" x2="800.0" y2="372.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/></svg>