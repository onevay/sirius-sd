<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1400" height="560" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Конвейер детекции (профиль mvp) и стоимость этапов</text><rect x="40.0" y="60.0" width="236.0" height="150.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="158.0" y="113.3" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Источник</text><text x="158.0" y="134.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">файл · папка-камера · RTSP</text><text x="158.0" y="150.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">декодирование в отдельном потоке</text><text x="158.0" y="165.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">5 к/с (режим качества 10)</text><text x="158.0" y="230.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">≈ 1× реального времени</text><rect x="316.0" y="60.0" width="236.0" height="150.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="434.0" y="113.3" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">Поза + трекинг</text><text x="434.0" y="134.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">YOLO26n-pose @960</text><text x="434.0" y="150.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">OpenVINO на iGPU</text><text x="434.0" y="165.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">BoT-SORT, буфер 3 с</text><text x="434.0" y="230.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">143 мс/кадр (n960)</text><line x1="278.0" y1="135.0" x2="314.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="592.0" y="60.0" width="236.0" height="150.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="710.0" y="113.3" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">Уточнение точек</text><text x="710.0" y="134.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">RTMPose-s только у людей</text><text x="710.0" y="150.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">с рукой у лица</text><text x="710.0" y="165.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">(gate 3 с, +1 с после)</text><text x="710.0" y="230.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">только у «руки у лица»</text><line x1="554.0" y1="135.0" x2="590.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="868.0" y="60.0" width="236.0" height="150.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="986.0" y="113.3" font-size="14" fill="#0f766e" font-weight="700" text-anchor="middle">Ряды признаков</text><text x="986.0" y="134.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">d_t = запястье–рот / ширина плеч</text><text x="986.0" y="150.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">сглаживание, скорости</text><text x="986.0" y="165.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">углы локтя</text><text x="986.0" y="230.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">миллисекунды</text><line x1="830.0" y1="135.0" x2="866.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1144.0" y="60.0" width="236.0" height="150.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="1262.0" y="113.3" font-size="14" fill="#0f766e" font-weight="700" text-anchor="middle">Автомат циклов</text><text x="1262.0" y="134.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">REST → APPROACH → AT_MOUTH</text><text x="1262.0" y="150.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">→ RETRACT; пауза 0.5–5 с</text><text x="1262.0" y="165.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">гистерезис 0.65 / 0.90</text><text x="1262.0" y="230.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">миллисекунды</text><line x1="1106.0" y1="135.0" x2="1142.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40.0" y="290.0" width="236.0" height="150.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="158.0" y="343.3" font-size="14" fill="#92400e" font-weight="700" text-anchor="middle">Признаки цикла</text><text x="158.0" y="364.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">предмет: Beehzod YOLO11m</text><text x="158.0" y="380.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">на кропе рта 320 px</text><text x="158.0" y="395.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">zero-shot CLIP, пауза, длительность</text><text x="158.0" y="460.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">1.8 с + 0.7 с на цикл</text><rect x="316.0" y="290.0" width="236.0" height="150.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="434.0" y="343.3" font-size="14" fill="#5b21b6" font-weight="700" text-anchor="middle">Классификатор цикла</text><text x="434.0" y="364.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">cycle_mvp: 2×LogReg + LightGBM</text><text x="434.0" y="380.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">среднее вероятностей</text><text x="434.0" y="395.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">порог цикла 0.4</text><text x="434.0" y="460.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">миллисекунды</text><line x1="278.0" y1="365.0" x2="314.0" y2="365.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="592.0" y="290.0" width="236.0" height="150.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="710.0" y="343.3" font-size="14" fill="#166534" font-weight="700" text-anchor="middle">Правила события</text><text x="710.0" y="364.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">2 цикла за 20 с</text><text x="710.0" y="380.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">или цикл + прямой признак</text><text x="710.0" y="395.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">склейка ≤ 15 с, порог 0.55</text><text x="710.0" y="460.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">миллисекунды</text><line x1="554.0" y1="365.0" x2="590.0" y2="365.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="868.0" y="290.0" width="236.0" height="150.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="6 4"/><text x="986.0" y="343.3" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Слияние / VLM</text><text x="986.0" y="364.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">опционально, выключено</text><text x="986.0" y="380.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">fusion: поправка логита</text><text x="986.0" y="395.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">VLM в серой зоне 0.3–0.8</text><text x="986.0" y="460.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">VLM ≈ 11 с на цикл</text><line x1="830.0" y1="365.0" x2="866.0" y2="365.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1144.0" y="290.0" width="236.0" height="150.0" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.4"/><text x="1262.0" y="343.3" font-size="14" fill="#991b1b" font-weight="700" text-anchor="middle">Событие → тревога</text><text x="1262.0" y="364.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">трек, начало, конец, peak_sec</text><text x="1262.0" y="380.3" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">рамка, уверенность</text><text x="1262.0" y="395.8" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">объяснение (правило, циклы)</text><text x="1262.0" y="460.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" font-style="italic">запись клипа</text><line x1="1106.0" y1="365.0" x2="1142.0" y2="365.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><path d="M1262.0,210 L1262.0,250 L158.0,250 L158.0,288" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40.0" y="490.0" width="1320.0" height="50.0" rx="8" fill="#f3f4f6" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="512.0" font-size="12.5" fill="#1f2937" font-weight="600" text-anchor="start">Итог на i3-1115G4 + iGPU (FINAL.md): 5 к/с — 1.23–1.33× реального времени на 1080p, 0.69–0.78 на плотных сценах, 0.54 на 4K HEVC.</text><text x="60.0" y="530.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Главная цена — частота кадров (74 % затяжек при 5 к/с против 82 % при 10 к/с) и признаки предмета на цикл; размер модели позы качества не добавил.</text></svg>