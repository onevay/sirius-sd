<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1400" height="560" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Движок реального времени (StreamEngine): как поток превращается в тревоги</text><rect x="25.0" y="75.0" width="172.0" height="110.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="111.0" y="109.4" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Кадры потока</text><text x="111.0" y="129.6" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">RTSP / файл в темпе ×1</text><text x="111.0" y="144.2" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">Pacer: пропуск при</text><text x="111.0" y="158.8" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">отставании</text><rect x="219.0" y="75.0" width="172.0" height="110.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="305.0" y="116.6" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">Поза + трек</text><text x="305.0" y="136.9" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">на каждом кадре</text><text x="305.0" y="151.5" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">в буфер детекций</text><line x1="199.0" y1="130.0" x2="217.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="413.0" y="75.0" width="172.0" height="110.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="499.0" y="116.6" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="middle">Буфер 90 с</text><text x="499.0" y="136.9" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">детекции и точки</text><text x="499.0" y="151.5" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">скользящее окно</text><line x1="393.0" y1="130.0" x2="411.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="607.0" y="75.0" width="172.0" height="110.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="693.0" y="116.6" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">Раз в 1 с</text><text x="693.0" y="136.9" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">ряды + автомат</text><text x="693.0" y="151.5" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">по буферу заново</text><line x1="587.0" y1="130.0" x2="605.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="801.0" y="75.0" width="172.0" height="110.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="887.0" y="116.6" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">«Устоявшиеся» циклы</text><text x="887.0" y="136.9" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">закончились &gt; 1 с назад</text><text x="887.0" y="151.5" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">кэш признаков по циклу</text><line x1="781.0" y1="130.0" x2="799.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="995.0" y="75.0" width="172.0" height="110.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="1081.0" y="116.6" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="middle">Классификатор</text><text x="1081.0" y="136.9" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">тот же пакет,</text><text x="1081.0" y="151.5" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">что offline</text><line x1="975.0" y1="130.0" x2="993.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1189.0" y="75.0" width="172.0" height="110.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="1275.0" y="116.6" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">Правила события</text><text x="1275.0" y="136.9" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">2 цикла / цикл+признак</text><text x="1275.0" y="151.5" font-size="10.8" fill="#6b7280" font-weight="400" text-anchor="middle">open → update → close</text><line x1="1169.0" y1="130.0" x2="1187.0" y2="130.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="25.0" y="260.0" width="330.0" height="110.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="190.0" y="301.4" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">FrameRing (45 с JPEG)</text><text x="190.0" y="321.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">≈10 МБ на камеру; из него — миниатюра и клип тревоги</text><text x="190.0" y="336.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">с запасом до начала события</text><rect x="400.0" y="260.0" width="300.0" height="110.0" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.4"/><text x="550.0" y="301.4" font-size="13" fill="#991b1b" font-weight="700" text-anchor="middle">AlertUpdate</text><text x="550.0" y="321.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">open: новая тревога; update: +цикл, уверенность;</text><text x="550.0" y="336.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">close: конец эпизода</text><rect x="745.0" y="260.0" width="280.0" height="110.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="885.0" y="301.4" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">Хранилище событий</text><text x="885.0" y="321.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">Event + Segment; решение оператора не</text><text x="885.0" y="336.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">затирается</text><rect x="1070.0" y="260.0" width="305.0" height="110.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="1222.5" y="308.8" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">SSE → интерфейс</text><text x="1222.5" y="329.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">цель: push за &lt; 1 с вместо опроса раз в 5 с</text><path d="M1275.0,185 L1275.0,225 L550,225 L550,258" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="702.0" y1="315.0" x2="743.0" y2="315.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="1027.0" y1="315.0" x2="1068.0" y2="315.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><path d="M111,185 L111,258" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah)"/><rect x="25.0" y="410.0" width="1350.0" height="120.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.2"/><text x="45.0" y="440.0" font-size="14" fill="#92400e" font-weight="700" text-anchor="start">Задержка и ограничения (по REALTIME.md и FINAL.md)</text><text x="45.0" y="465.0" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">• Тревога приходит через ≈ 5–15 с после начала курения: регламенту нужно два цикла; медианная задержка относительно эталона 0.5 с.</text><text x="45.0" y="486.0" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">• В «живом» потоке без исходного файла признаки предмета и фото не считаются — годится только быстрый классификатор без предмета (нужно доработать).</text><text x="45.0" y="507.0" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start">• Склейки треков онлайн нет: смена ID человека делит эпизод на 1 TP + 1 FP. Один воркер обходит камеры последовательно; RTSP-источник не подключён к монитору.</text></svg>