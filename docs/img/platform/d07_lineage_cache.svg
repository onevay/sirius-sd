<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1400" height="560" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Происхождение артефактов и ключи кэша</text><rect x="30.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="98.0" y="112.1" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Видео</text><text x="98.0" y="132.4" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">ключ: sha256 файла</text><rect x="184.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="252.0" y="98.0" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">Поза + трек</text><text x="252.0" y="118.2" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">окно, веса (sha),</text><text x="252.0" y="132.4" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">imgsz,</text><text x="252.0" y="146.6" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">runtime, трекер, fps</text><line x1="168.0" y1="118.0" x2="182.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="338.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="406.0" y="112.1" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">Ряды d_t</text><text x="406.0" y="132.4" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">hash секции features</text><line x1="322.0" y1="118.0" x2="336.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="492.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="560.0" y="112.1" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">Циклы</text><text x="560.0" y="132.4" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">hash секции cycles</text><line x1="476.0" y1="118.0" x2="490.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="646.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="714.0" y="105.0" font-size="13" fill="#92400e" font-weight="700" text-anchor="middle">Обогащение</text><text x="714.0" y="125.3" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">детектор (sha весов),</text><text x="714.0" y="139.5" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">кроп, CLIP, VLM</text><line x1="630.0" y1="118.0" x2="644.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="800.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="868.0" y="96.9" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="middle">Таблица</text><text x="868.0" y="113.2" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="middle">признаков</text><text x="868.0" y="133.4" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">sha рецепта + входов</text><text x="868.0" y="147.6" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">+ отпечаток меток</text><line x1="784.0" y1="118.0" x2="798.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="954.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="1022.0" y="112.1" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="middle">Модель</text><text x="1022.0" y="132.4" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">sha пакета, схема CV</text><line x1="938.0" y1="118.0" x2="952.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1108.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="1176.0" y="105.0" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">Прогон оценки</text><text x="1176.0" y="125.3" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">отпечаток профиля</text><text x="1176.0" y="139.5" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">+ gt_fingerprint</text><line x1="1092.0" y1="118.0" x2="1106.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1262.0" y="70.0" width="136.0" height="96.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="1330.0" y="105.0" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">PDF-отчёт</text><text x="1330.0" y="125.3" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">sha + ссылка на</text><text x="1330.0" y="139.5" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">прогон</text><line x1="1246.0" y1="118.0" x2="1260.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="30.0" y="210.0" width="660.0" height="150.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="42.0" y="262.2" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">Правило</text><text x="42.0" y="283.8" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Ключ этапа = hash(ключи входов + параметры этапа + sha весов + версия кода этапа). Изменили параметр</text><text x="42.0" y="299.9" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">— пересчитывается этот этап и всё ниже; всё выше берётся из кэша. Артефакт неизменяем: новый ключ →</text><text x="42.0" y="316.1" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">новая папка, старая не перезаписывается.</text><rect x="710.0" y="210.0" width="660.0" height="150.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="722.0" y="262.2" font-size="14" fill="#92400e" font-weight="700" text-anchor="start">Манифест вместо «последнего прогона»</text><text x="722.0" y="283.8" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Таблица признаков, модель и прогон хранят манифест с точными ключами входов. Сейчас обучение берёт</text><text x="722.0" y="299.9" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">лексикографически последний запуск recognize (oof_eval.collect) — результат зависит от того, что</text><text x="722.0" y="316.1" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">запускали последним.</text><text x="30.0" y="400.0" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">Сейчас (outputs/)</text><text x="710.0" y="400.0" font-size="14" fill="#1f2937" font-weight="700" text-anchor="start">Цель (artifacts/ + БД)</text><text x="40.0" y="428.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• runs/&lt;видео&gt;/&lt;run_id&gt;/pose|features/&lt;hash&gt;|cycles/&lt;hash&gt;  — уже по хэшам ✓</text><text x="40.0" y="452.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• recognize/&lt;видео&gt;/&lt;окно&gt;_&lt;время&gt;/  — новая папка на каждый запуск ✗</text><text x="40.0" y="476.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• enrich/&lt;клип&gt;/ + alt_&lt;подпись&gt;/  — два уровня логики ✗</text><text x="40.0" y="500.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• eval_cache/&lt;hash&gt;/  — ключ: профиль + путь + размер + mtime ~</text><text x="40.0" y="524.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• experiments/&lt;время&gt;_&lt;имя&gt;/  — журнал без связи с метками ~</text><text x="720.0" y="428.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• artifacts/&lt;этап&gt;/&lt;ключ&gt;/  + запись StageRun в БД</text><text x="720.0" y="452.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• GC: удаляется то, на что не ссылается ни один манифест</text><text x="720.0" y="476.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• DuckDB поверх Parquet: «все циклы всех прогонов» одним запросом</text><text x="720.0" y="500.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• eval_runs: профиль, labelset, данные, железо, git — в одной строке</text><text x="720.0" y="524.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">• отчёт PDF ссылается на прогон и воспроизводим по ключам</text></svg>