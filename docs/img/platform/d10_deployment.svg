<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 660" width="1420" height="660" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1420" height="660" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Варианты развёртывания</text><rect x="20.0" y="55.0" width="420.0" height="580.0" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="40.0" y="85.0" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">A. Один ПК: десктоп оператора</text><rect x="50.0" y="110.0" width="360.0" height="70.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="230.0" y="138.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Окно приложения (pywebview)</text><text x="230.0" y="159.1" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">WebView2 на Windows, тот же SPA</text><rect x="50.0" y="215.0" width="360.0" height="70.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="230.0" y="243.8" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">FastAPI на 127.0.0.1:случайный порт</text><text x="230.0" y="264.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">токен запуска, без внешней сети</text><rect x="50.0" y="320.0" width="170.0" height="80.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="135.0" y="354.0" font-size="12.5" fill="#5b21b6" font-weight="700" text-anchor="middle">Inference-воркер</text><text x="135.0" y="373.6" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">процесс на 1–4 камеры</text><rect x="240.0" y="320.0" width="170.0" height="80.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="325.0" y="354.0" font-size="12.5" fill="#5b21b6" font-weight="700" text-anchor="middle">Исполнитель задач</text><text x="325.0" y="373.6" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">отчёты, retention</text><rect x="50.0" y="435.0" width="360.0" height="70.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="230.0" y="463.8" font-size="13" fill="#166534" font-weight="700" text-anchor="middle">SQLite (WAL) + файлы</text><text x="230.0" y="484.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">%LOCALAPPDATA%\SmokingDetector</text><rect x="50.0" y="540.0" width="360.0" height="70.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="230.0" y="568.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Источники</text><text x="230.0" y="589.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">RTSP-камеры объекта или папки</text><line x1="230.0" y1="180.0" x2="230.0" y2="213.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="135.0" y1="285.0" x2="135.0" y2="318.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="325.0" y1="285.0" x2="325.0" y2="318.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="135.0" y1="400.0" x2="135.0" y2="433.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="325.0" y1="400.0" x2="325.0" y2="433.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><path d="M50,575 L36,575 L36,360 L48,360" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="60.0" y="632.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Сборка: PyInstaller (onedir) + инсталлятор; модели — отдельным пакетом.</text><rect x="460.0" y="55.0" width="560.0" height="580.0" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="480.0" y="85.0" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">B. Объекты (edge) + центр</text><rect x="480.0" y="115.0" width="230.0" height="120.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.2"/><text x="495.0" y="139.0" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="start">Edge-узел объекта 1</text><text x="495.0" y="161.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">ingest RTSP → сегменты</text><text x="495.0" y="179.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">StreamEngine (GPU/iGPU)</text><text x="495.0" y="197.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">локальный буфер 7–30 дней</text><text x="495.0" y="215.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">N камер</text><rect x="480.0" y="255.0" width="230.0" height="120.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.2"/><text x="495.0" y="279.0" font-size="13" fill="#5b21b6" font-weight="700" text-anchor="start">Edge-узел объекта 2</text><text x="495.0" y="301.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">ingest RTSP → сегменты</text><text x="495.0" y="319.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">StreamEngine (GPU/iGPU)</text><text x="495.0" y="337.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">локальный буфер 7–30 дней</text><text x="495.0" y="355.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">N камер</text><rect x="480.0" y="400.0" width="230.0" height="80.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="595.0" y="433.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Камеры объекта</text><text x="595.0" y="454.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">RTSP, только локальная сеть</text><line x1="595.0" y1="400.0" x2="595.0" y2="377.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="760.0" y="115.0" width="240.0" height="365.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.2"/><text x="775.0" y="140.0" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="start">Центр</text><rect x="775.0" y="155.0" width="210.0" height="50.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="880.0" y="184.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">FastAPI + SPA</text><rect x="775.0" y="217.0" width="210.0" height="50.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="880.0" y="246.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">PostgreSQL</text><rect x="775.0" y="279.0" width="210.0" height="50.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="880.0" y="308.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">MinIO: клипы, отчёты</text><rect x="775.0" y="341.0" width="210.0" height="50.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="880.0" y="370.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Реестр решателей</text><rect x="775.0" y="403.0" width="210.0" height="50.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="880.0" y="432.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Аудит, роли, SSO</text><line x1="712.0" y1="175.0" x2="758.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="735.0" y="175.5" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">события,</text><text x="735.0" y="218.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">клипы</text><line x1="758.0" y1="330.0" x2="712.0" y2="310.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="735.0" y="338.0" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle">решатель</text><rect x="480.0" y="520.0" width="520.0" height="90.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="740.0" y="551.4" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Операторы</text><text x="740.0" y="571.6" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">браузер или десктоп-клиент к центру; HTTPS + mTLS между edge и центром; видео по</text><text x="740.0" y="586.5" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">запросу (HLS)</text><line x1="880.0" y1="482.0" x2="880.0" y2="518.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="1040.0" y="55.0" width="360.0" height="580.0" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="1060.0" y="85.0" font-size="15" fill="#1f2937" font-weight="700" text-anchor="start">C. Демо-ноутбук</text><rect x="1070.0" y="115.0" width="300.0" height="80.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1220.0" y="148.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Режим «Демо»</text><text x="1220.0" y="169.0" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">тот же SPA, плашка DEMO</text><rect x="1070.0" y="225.0" width="300.0" height="90.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="1220.0" y="256.4" font-size="13" fill="#0f766e" font-weight="700" text-anchor="middle">Предрасчитанные трассы</text><text x="1220.0" y="276.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">trace.json по каждому видео; не зависит от</text><text x="1220.0" y="291.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">железа</text><rect x="1070.0" y="345.0" width="300.0" height="80.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="1220.0" y="378.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Локальные папки</text><text x="1220.0" y="399.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">виртуальные камеры на карте</text><rect x="1070.0" y="455.0" width="300.0" height="90.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="1220.0" y="493.8" font-size="13" fill="#92400e" font-weight="700" text-anchor="middle">Без сети</text><text x="1220.0" y="514.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">офлайн-тайлы карты, маскирование лиц</text><line x1="1220.0" y1="225.0" x2="1220.0" y2="197.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="1220.0" y1="345.0" x2="1220.0" y2="317.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/></svg>