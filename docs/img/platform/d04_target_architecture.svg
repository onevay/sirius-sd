<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1400" height="900" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Целевая архитектура: слои и зависимости (сверху вниз)</text><rect x="30.0" y="60.0" width="1340.0" height="112.0" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2" fill-opacity="0.55"/><text x="44.0" y="121.0" font-size="14" fill="#374151" font-weight="700" text-anchor="start">Интерфейсы</text><rect x="210.0" y="76.0" width="205.0" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="312.5" y="120.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">CLI sd (Typer)</text><rect x="427.0" y="76.0" width="205.0" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="529.6" y="120.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Dev Studio (Streamlit)</text><rect x="644.1" y="76.0" width="205.0" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="746.6" y="120.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">SPA оператора (веб)</text><rect x="861.1" y="76.0" width="205.0" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="963.6" y="120.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Десктоп (pywebview)</text><rect x="1078.2" y="76.0" width="279.8" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1218.1" y="120.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Интеграции: REST, webhook, MQTT</text><rect x="30.0" y="194.0" width="1340.0" height="112.0" rx="12" fill="#e8effd" stroke="#2563eb" stroke-width="1.2" fill-opacity="0.55"/><text x="44.0" y="255.0" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="start">API и процессы</text><rect x="210.0" y="210.0" width="219.1" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="319.5" y="246.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">FastAPI /api/v1 + SSE +</text><text x="319.5" y="261.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">OpenAPI</text><rect x="441.1" y="210.0" width="228.7" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="555.4" y="246.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Исполнитель задач (очередь</text><text x="555.4" y="261.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">jobs)</text><rect x="681.8" y="210.0" width="216.7" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="790.1" y="246.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Ingest: RTSP / папки →</text><text x="790.1" y="261.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">сегменты</text><rect x="910.5" y="210.0" width="228.9" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1024.9" y="246.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Inference: StreamEngine на</text><text x="1024.9" y="261.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">камеру</text><rect x="1151.4" y="210.0" width="206.6" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1254.7" y="246.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Планировщик: retention,</text><text x="1254.7" y="261.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">отчёты</text><rect x="30.0" y="328.0" width="1340.0" height="112.0" rx="12" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.2" fill-opacity="0.55"/><text x="44.0" y="389.0" font-size="14" fill="#0f766e" font-weight="700" text-anchor="start">Сервисы sd.services</text><rect x="210.0" y="344.0" width="163.5" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="291.7" y="388.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Оценка и PDF-отчёты</text><rect x="385.5" y="344.0" width="181.2" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="476.1" y="380.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Обучение и реестр</text><text x="476.1" y="395.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">моделей</text><rect x="578.7" y="344.0" width="167.4" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="662.4" y="380.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Разметка и наборы</text><text x="662.4" y="395.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">меток</text><rect x="758.1" y="344.0" width="183.9" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="850.0" y="380.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">События, инциденты,</text><text x="850.0" y="395.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">разбор</text><rect x="954.0" y="344.0" width="176.3" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1042.1" y="380.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Пользователи, роли,</text><text x="1042.1" y="395.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">аудит</text><rect x="1142.2" y="344.0" width="215.8" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1250.1" y="380.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Выпуск: freeze + пакет</text><text x="1250.1" y="395.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">решателя</text><rect x="30.0" y="462.0" width="1340.0" height="112.0" rx="12" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.2" fill-opacity="0.55"/><text x="44.0" y="523.0" font-size="14" fill="#5b21b6" font-weight="700" text-anchor="start">Движок sd.engine</text><rect x="210.0" y="478.0" width="440.0" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="430.0" y="514.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Stage API: поза → трек → ряды → циклы → признаки → оценка →</text><text x="430.0" y="529.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">правила</text><rect x="662.0" y="478.0" width="301.8" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="812.9" y="514.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Плагины: детекторы, классификаторы,</text><text x="812.9" y="529.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">сценарии</text><rect x="975.8" y="478.0" width="201.5" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1076.6" y="514.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">StreamEngine (реальное</text><text x="1076.6" y="529.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">время)</text><rect x="1189.3" y="478.0" width="168.7" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1273.7" y="514.2" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Кэш этапов по</text><text x="1273.7" y="529.9" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">отпечаткам</text><rect x="30.0" y="596.0" width="1340.0" height="112.0" rx="12" fill="#fdf3e3" stroke="#b45309" stroke-width="1.2" fill-opacity="0.55"/><text x="44.0" y="657.0" font-size="14" fill="#92400e" font-weight="700" text-anchor="start">Ядро sd.core</text><rect x="210.0" y="612.0" width="306.0" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="363.0" y="656.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Доменные типы: Track, Cycle, Event</text><rect x="528.0" y="612.0" width="275.6" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="665.8" y="656.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Регламент сценария (правила)</text><rect x="815.6" y="612.0" width="254.4" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="942.8" y="656.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Метрики: Event F1, bootstrap</text><rect x="1082.0" y="612.0" width="276.0" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1220.0" y="656.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Схема конфигурации (pydantic)</text><rect x="30.0" y="730.0" width="1340.0" height="112.0" rx="12" fill="#e8f5ec" stroke="#15803d" stroke-width="1.2" fill-opacity="0.55"/><text x="44.0" y="791.0" font-size="14" fill="#166534" font-weight="700" text-anchor="start">Данные sd.data</text><rect x="210.0" y="746.0" width="290.6" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="355.3" y="790.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">БД: SQLite (1 узел) → PostgreSQL</text><rect x="512.6" y="746.0" width="277.7" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="651.4" y="790.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Артефакты по sha256: ФС / MinIO</text><rect x="802.3" y="746.0" width="239.5" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="922.0" y="790.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Признаки: Parquet + DuckDB</text><rect x="1053.8" y="746.0" width="304.2" height="80.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="1205.9" y="790.1" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Видео: сегменты, клипы, миниатюры</text><line x1="1385.0" y1="142.0" x2="1385.0" y2="180.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="1385.0" y1="276.0" x2="1385.0" y2="314.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="1385.0" y1="410.0" x2="1385.0" y2="448.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="1385.0" y1="544.0" x2="1385.0" y2="582.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="1385.0" y1="678.0" x2="1385.0" y2="716.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="30.0" y="885.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Правило зависимостей: слой видит только нижние слои; ядро и движок не знают о веб, Streamlit и БД — поэтому один и тот же движок работает в CLI, dev-режиме, сервере и десктопе.</text></svg>