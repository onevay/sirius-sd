<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 560" width="1150" height="560" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1150" height="560" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Автомат цикла жеста: состояния и переходы</text><rect x="70.0" y="170.0" width="200.0" height="86.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="170.0" y="207.4" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">REST</text><text x="170.0" y="231.4" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">рука далеко</text><rect x="340.0" y="170.0" width="200.0" height="86.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="440.0" y="207.4" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">APPROACH</text><text x="440.0" y="231.4" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">рука идёт к лицу</text><rect x="610.0" y="170.0" width="200.0" height="86.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="710.0" y="207.4" font-size="16" fill="#0f766e" font-weight="700" text-anchor="middle">AT_MOUTH</text><text x="710.0" y="231.4" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">пауза у рта</text><rect x="880.0" y="170.0" width="200.0" height="86.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="980.0" y="207.4" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">RETRACT</text><text x="980.0" y="231.4" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">рука уходит</text><line x1="270.0" y1="200.0" x2="338.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="304.0" y="194.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">d_t убывает</text><line x1="540.0" y1="200.0" x2="608.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="574.0" y="194.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">d_t &lt; 0.65</text><line x1="810.0" y1="200.0" x2="878.0" y2="200.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="844.0" y="194.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">d_t &gt; 0.90</text><path d="M980,256 C980,370 170,370 170,258" fill="none" stroke="#15803d" stroke-width="1.8" marker-end="url(#ah)"/><text x="575.0" y="370.0" font-size="12" fill="#166534" font-weight="600" text-anchor="middle">цикл завершён → вектор цикла (start, peak_t, end, пауза, длительность, качество точек)</text><path d="M710,170 C710,80 170,80 170,168" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="440.0" y="96.0" font-size="12" fill="#991b1b" font-weight="600" text-anchor="middle">пауза &gt; hold_cap (12 с) или &lt; 0.5 с → отклонён (rejected)</text><path d="M440,170 C440,130 200,130 200,168" fill="none" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ah)"/><text x="320.0" y="130.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">рука не дошла / трек потерян</text><rect x="70.0" y="420.0" width="490.0" height="110.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="82.0" y="452.9" font-size="13" fill="#1f2937" font-weight="700" text-anchor="start">Почему два порога (гистерезис)</text><text x="82.0" y="473.2" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">Вход «у рта» при 0.65 ширины плеч, выход — только после 0.90. Одиночный порог</text><text x="82.0" y="488.7" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">давал бы дребезг на шуме точек; гистерезис превращает шумный ряд в чистые</text><text x="82.0" y="504.2" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">интервалы.</text><rect x="590.0" y="420.0" width="490.0" height="110.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="602.0" y="460.7" font-size="13" fill="#92400e" font-weight="700" text-anchor="start">Сколько затяжек находит автомат</text><text x="602.0" y="481.0" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">131 размеченная затяжка в 17 клипах: 82 % при 10 к/с, 74 % при 5 к/с. Пропуски</text><text x="602.0" y="496.5" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">автомата классификатор уже не вернёт — это потолок recall всей системы.</text></svg>