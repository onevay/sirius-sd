<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 640" width="1350" height="640" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1350" height="640" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Два режима над общим ядром и петля обратной связи</text><rect x="30.0" y="60.0" width="390.0" height="540.0" rx="14" fill="#e8effd" stroke="#2563eb" stroke-width="1.2"/><text x="50.0" y="92.0" font-size="17" fill="#1d4ed8" font-weight="700" text-anchor="start">Режим разработчика</text><text x="50.0" y="112.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Dev Studio · Streamlit · инженер ML</text><rect x="50.0" y="130.0" width="350.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="225.0" y="151.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Валидация</text><text x="225.0" y="172.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">прогон конфигурации по папкам, PDF-отчёт, анализ кэша</text><rect x="50.0" y="194.0" width="350.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="225.0" y="215.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Задачи</text><text x="225.0" y="236.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">разметка, признаки, обучение, результаты</text><rect x="50.0" y="258.0" width="350.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="225.0" y="279.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Данные</text><text x="225.0" y="300.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">каталог, качество, конфликты меток</text><rect x="50.0" y="322.0" width="350.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="225.0" y="343.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Эксперименты</text><text x="225.0" y="364.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">журнал, парное сравнение</text><rect x="50.0" y="386.0" width="350.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="225.0" y="407.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Модели</text><text x="225.0" y="428.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">реестр, лицензии, проверка весов</text><rect x="50.0" y="450.0" width="350.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="225.0" y="471.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Профилирование</text><text x="225.0" y="492.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">лестница вычислений, железо</text><rect x="50.0" y="514.0" width="350.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="225.0" y="535.8" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Выпуск</text><text x="225.0" y="556.1" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">заморозка, подписанный пакет</text><rect x="930.0" y="60.0" width="390.0" height="540.0" rx="14" fill="#1f2937" stroke="#111827" stroke-width="1.2"/><text x="950.0" y="92.0" font-size="17" fill="#5ed3c0" font-weight="700" text-anchor="start">Продукт оператора</text><text x="950.0" y="112.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="start">SPA (веб) и десктоп · один код</text><rect x="950.0" y="130.0" width="350.0" height="56.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1125.0" y="151.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Обзор города</text><text x="1125.0" y="172.0" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">карта, KPI, лента событий</text><rect x="950.0" y="194.0" width="350.0" height="56.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1125.0" y="215.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Очередь событий</text><text x="1125.0" y="236.0" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">триаж, горячие клавиши, SLA</text><rect x="950.0" y="258.0" width="350.0" height="56.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1125.0" y="279.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Карточка события</text><text x="1125.0" y="300.1" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">клип, «почему», решение + причина</text><rect x="950.0" y="322.0" width="350.0" height="56.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1125.0" y="343.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Разбор</text><text x="1125.0" y="364.1" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">ретроспектива, доля ложных, причины</text><rect x="950.0" y="386.0" width="350.0" height="56.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1125.0" y="407.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Камеры</text><text x="1125.0" y="428.1" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">здоровье потоков, ROI</text><rect x="950.0" y="450.0" width="350.0" height="56.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1125.0" y="471.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Отчёты</text><text x="1125.0" y="492.1" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">PDF/CSV за период</text><rect x="950.0" y="514.0" width="350.0" height="56.0" rx="10" fill="#1f2937" stroke="#111827" stroke-width="1.4"/><text x="1125.0" y="535.8" font-size="13" fill="#f9fafb" font-weight="700" text-anchor="middle">Демо</text><text x="1125.0" y="556.1" font-size="11" fill="#d1d5db" font-weight="400" text-anchor="middle">имитация платформы на папках</text><rect x="480.0" y="150.0" width="390.0" height="360.0" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.2"/><text x="675.0" y="182.0" font-size="17" fill="#1f2937" font-weight="700" text-anchor="middle">Общее ядро</text><rect x="500.0" y="200.0" width="350.0" height="60.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="675.0" y="234.4" font-size="13.5" fill="#5b21b6" font-weight="700" text-anchor="middle">Движок и плагины</text><rect x="500.0" y="272.0" width="350.0" height="60.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="675.0" y="306.4" font-size="13.5" fill="#0f766e" font-weight="700" text-anchor="middle">Реестр моделей и решателей</text><rect x="500.0" y="344.0" width="350.0" height="60.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="675.0" y="378.4" font-size="13.5" fill="#92400e" font-weight="700" text-anchor="middle">Наборы меток (версии)</text><rect x="500.0" y="416.0" width="350.0" height="60.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="675.0" y="450.4" font-size="13.5" fill="#166534" font-weight="700" text-anchor="middle">Хранилище событий и решений</text><line x1="422.0" y1="220.0" x2="478.0" y2="220.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="450.0" y="202.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">обучение,</text><text x="450.0" y="213.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">оценка</text><line x1="872.0" y1="220.0" x2="928.0" y2="220.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="900.0" y="195.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">пакет</text><text x="900.0" y="208.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">решателя</text><line x1="928.0" y1="440.0" x2="872.0" y2="440.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="900.0" y="466.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">решения</text><text x="900.0" y="479.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">оператора</text><line x1="478.0" y1="440.0" x2="422.0" y2="440.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><text x="450.0" y="466.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">жёсткие</text><text x="450.0" y="479.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">негативы</text><text x="675.0" y="560.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">Выпуск идёт только через подписанный пакет: продукт не видит «сырых» экспериментов,</text><text x="675.0" y="578.0" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">а решения оператора возвращаются в разметку только после проверки разметчиком.</text></svg>