<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" width="1150" height="700" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#d1d5db" stroke-width="3"/></pattern></defs><rect width="1150" height="700" fill="#ffffff"/><text x="24.0" y="34.0" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start">Петля улучшения модели (MLOps) с воротами качества</text><rect x="460.0" y="95.0" width="230.0" height="90.0" rx="10" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/><text x="575.0" y="126.7" font-size="14" fill="#92400e" font-weight="700" text-anchor="middle">Данные и разметка</text><text x="575.0" y="148.2" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">LabelSet v+1</text><text x="575.0" y="163.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">второй разметчик, κ</text><rect x="663.5" y="212.5" width="230.0" height="90.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="778.5" y="244.2" font-size="14" fill="#5b21b6" font-weight="700" text-anchor="middle">Признаки</text><text x="778.5" y="265.7" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">FeatureTable</text><text x="778.5" y="280.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">по рецепту, в кэше</text><rect x="663.5" y="447.5" width="230.0" height="90.0" rx="10" fill="#f1ecfd" stroke="#6d28d9" stroke-width="1.4"/><text x="778.5" y="479.2" font-size="14" fill="#5b21b6" font-weight="700" text-anchor="middle">Обучение</text><text x="778.5" y="500.7" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">CV по видео/сцене</text><text x="778.5" y="515.5" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">диагностика переобучения</text><rect x="460.0" y="565.0" width="230.0" height="90.0" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.4"/><text x="575.0" y="596.7" font-size="14" fill="#0f766e" font-weight="700" text-anchor="middle">Валидация</text><text x="575.0" y="618.2" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">holdout + вложенный порог</text><text x="575.0" y="633.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">PDF-отчёт</text><rect x="256.5" y="447.5" width="230.0" height="90.0" rx="10" fill="#e8f5ec" stroke="#15803d" stroke-width="1.4"/><text x="371.5" y="479.2" font-size="14" fill="#166534" font-weight="700" text-anchor="middle">Заморозка и выпуск</text><text x="371.5" y="500.7" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">подписанный решатель</text><text x="371.5" y="515.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">manifest + git-тег</text><rect x="256.5" y="212.5" width="230.0" height="90.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="371.5" y="244.2" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">Эксплуатация</text><text x="371.5" y="265.7" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">события, решения</text><text x="371.5" y="280.6" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle">оператора, дрейф</text><line x1="657.3" y1="170.0" x2="696.2" y2="227.5" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="778.5" y1="317.5" x2="778.5" y2="432.5" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="696.2" y1="522.5" x2="657.3" y2="580.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="492.7" y1="580.0" x2="453.8" y2="522.5" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="371.5" y1="432.5" x2="371.5" y2="317.5" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><line x1="453.8" y1="227.5" x2="492.7" y2="170.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/><rect x="425.0" y="320.0" width="300.0" height="110.0" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/><text x="575.0" y="361.4" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Реестр</text><text x="575.0" y="384.1" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">каждый артефакт — по отпечатку; любой выпуск</text><text x="575.0" y="399.6" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="middle">воспроизводим от видео до PDF</text><rect x="820.0" y="70.0" width="310.0" height="110.0" rx="10" fill="#fdecec" stroke="#b91c1c" stroke-width="1.4"/><text x="832.0" y="103.9" font-size="13" fill="#991b1b" font-weight="700" text-anchor="start">Ворота выпуска</text><text x="832.0" y="124.2" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">F1 на holdout ≥ текущий − 0.02 (CI учтён)</text><text x="832.0" y="139.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">FP/час ≤ согласованного</text><text x="832.0" y="153.9" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">rt_factor ≥ 1 на целевом железе</text><rect x="20.0" y="70.0" width="300.0" height="110.0" rx="10" fill="#e8effd" stroke="#2563eb" stroke-width="1.4"/><text x="32.0" y="103.9" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="start">Обратная связь</text><text x="32.0" y="124.2" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">«ложное» + причина → жёсткий негатив</text><text x="32.0" y="139.0" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">«подтверждено» → позитив</text><text x="32.0" y="153.9" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">оба — после проверки разметчиком</text></svg>